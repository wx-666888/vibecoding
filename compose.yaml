services:
  server:
    build:
      context: .
      target: server
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - RULES_FILE=/app/rules/rules.json
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 10
      start_period: 1s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

  client:
    build:
      context: .
      target: client
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./examples/input.json:/data/input.json:ro
    environment:
      - INPUT_FILE=/data/input.json
      - SERVER_URL=http://server:8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
